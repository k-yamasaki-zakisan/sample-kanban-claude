# 開発環境専用設定
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kanban_db
    driver-class-name: org.postgresql.Driver
    username: kanban_user
    password: kanban_password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main
      exclude: static/**,public/**
    livereload:
      enabled: true

# S3/MinIO設定（開発環境）
s3:
  endpoint: http://localhost:9000  # MinIOエンドポイント
  region: us-east-1
  access-key: minio_user
  secret-key: minio_password123
  bucket-name: kanban-images
  path-style-access: true  # MinIO用にpath-styleアクセスを有効化

# 開発環境用ログレベル
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.boot.devtools: DEBUG
    com.example.kanban: DEBUG
    root: INFO